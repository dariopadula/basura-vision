<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Basura Visión · resultados</title><style>
:root{font:15px system-ui;color:#172334;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;background:white;padding:14px 22px;border-bottom:1px solid #ccd3da}h1{font-size:21px;margin:0 0 9px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{font:inherit;padding:7px 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:14px;padding:18px}.card{background:white;border:1px solid #d8dde2;border-radius:8px;padding:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair figure{margin:0}.pair img{width:100%;height:240px;object-fit:contain;background:#18202a}.pair figcaption{text-align:center;font-size:12px}.meta{overflow-wrap:anywhere}.marked{outline:4px solid #f2b705}.empty{display:grid;place-items:center;height:240px;background:#e8ebee;color:#667}.bad{color:#9d271b}@media(max-width:520px){.grid{grid-template-columns:1fr;padding:8px}.pair img{height:180px}}
</style></head><body><header><h1>Resultados de detección y agrupación</h1><div class="controls"><label>Estado <select id="status"><option value="">Todos</option><option value="agrupable">Agrupables</option><option value="sin_residuos">Sin residuos</option><option value="sin_contenedor">Sin contenedor</option></select></label><label>Grupo <select id="cluster"><option value="">Todos</option></select></label><button id="clear">Quitar marcas</button><button id="export">Exportar selección JSONL</button><span id="count"></span></div></header><main class="grid" id="grid"></main><script>
const $=x=>document.getElementById(x);let items=[],marked=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let status=$('status').value,cluster=$('cluster').value,shown=items.filter(x=>(!status||x.status===status)&&(!cluster||String(x.cluster)===cluster));$('count').textContent=`${shown.length} visibles · ${marked.size} marcadas`;$('grid').innerHTML=shown.map(x=>`<article class="card ${marked.has(x.id)?'marked':''}" data-id="${esc(x.id)}"><label><input class="mark" type="checkbox" ${marked.has(x.id)?'checked':''}> Marcar</label><div class="pair"><figure><img loading="lazy" src="/original?id=${encodeURIComponent(x.id)}"><figcaption>Original</figcaption></figure><figure>${x.crop_path?`<img loading="lazy" src="/crop?id=${encodeURIComponent(x.id)}">`:'<div class="empty">Sin recorte</div>'}<figcaption>Recorte mínimo</figcaption></figure></div><p class="meta"><b>${esc(x.id)}</b><br>Estado: ${esc(x.status)} · Grupo: ${esc(x.cluster??'—')} · Ratio: ${x.ratio==null?'—':x.ratio.toFixed(6)}<br><small>${esc(x.path)}</small>${x.reference_status&&String(x.reference_status)!==String(x.cluster??x.status)?`<br><span class="bad">Referencia: ${esc(x.reference_status)}</span>`:''}</p></article>`).join('');document.querySelectorAll('.mark').forEach(e=>e.onchange=()=>{let id=e.closest('.card').dataset.id;e.checked?marked.add(id):marked.delete(id);render()})}
fetch('/api/items').then(r=>r.json()).then(x=>{items=x;let clusters=[...new Set(x.map(v=>v.cluster).filter(v=>v!=null))].sort((a,b)=>Number(a)-Number(b));$('cluster').innerHTML+=[...clusters].map(v=>`<option>${esc(v)}</option>`).join('');render()});$('status').onchange=$('cluster').onchange=render;$('clear').onclick=()=>{marked.clear();render()};$('export').onclick=()=>{let text=items.filter(x=>marked.has(x.id)).map(x=>JSON.stringify({id:x.id,path:x.path,event_id:x.event_id,cluster:x.cluster,status:x.status,ratio:x.ratio,crop_path:x.crop_path})).join('\n')+'\n';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/x-ndjson'}));a.download='seleccion.jsonl';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
