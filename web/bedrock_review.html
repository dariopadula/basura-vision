<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Basura Visión · revisión ciega</title>
<style>
:root{font:15px system-ui;color:#172334;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;background:white;padding:12px 20px;border-bottom:1px solid #ccd3da}h1{font-size:21px;margin:0 0 4px}.blind{margin:0;color:#52606d}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}button,select,textarea{font:inherit}button{padding:7px 11px}.layout{display:grid;grid-template-columns:minmax(330px,1.25fr) minmax(520px,1fr);gap:16px;padding:16px}.photo,.form{background:white;border:1px solid #d8dde2;border-radius:8px;padding:12px}.photo img{display:block;width:100%;height:72vh;object-fit:contain;background:#18202a}.meta{overflow-wrap:anywhere}.categories{width:100%;border-collapse:collapse}.categories th,.categories td{border-bottom:1px solid #e1e5e9;padding:9px 6px;text-align:left}.categories select{padding:5px;min-width:95px}.categories input{width:18px;height:18px}textarea{width:100%;min-height:80px;padding:7px}.saved{color:#14733e}.warn{color:#a02b20}.reviewed{background:#eaf7ef}@media(max-width:900px){.layout{grid-template-columns:1fr}.photo img{height:55vh}}
</style>
</head>
<body>
<header><h1>Revisión visual ciega</h1><p class="blind">Las respuestas de Bedrock no se muestran en esta pantalla.</p><div class="toolbar"><button id="prev">← Anterior</button><button id="next">Siguiente →</button><button id="save">Guardar y seguir</button><span id="progress"></span></div></header>
<main class="layout"><section class="photo"><img id="photo"><p class="meta" id="meta"></p></section><section class="form"><p>Marca solamente las categorías presentes. Sin marcar significa <b>No</b>.</p><table class="categories"><thead><tr><th>Categoría</th><th>Presente</th><th>Severidad</th><th>Evidencia dudosa</th></tr></thead><tbody id="rows"></tbody></table><p><label>Notas opcionales<br><textarea id="notes" maxlength="2000"></textarea></label></p><p id="message"></p></section></main>
<script>
const $=id=>document.getElementById(id);let photos=[],reviews={},categories=[],token='',index=0,dirty=false;
const labels={basura_fuera:'Basura fuera',residuos_esparcidos:'Residuos esparcidos',poda:'Poda',contenedor_desbordado:'Contenedor desbordado',contenedor_roto:'Contenedor roto',voluminoso:'Voluminoso'};
function current(){return photos[index]}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function message(text,bad=false){$('message').textContent=text;$('message').className=bad?'warn':'saved'}
function values(){let result={};for(let category of categories){let present=$('p_'+category).checked,severity=$('s_'+category).value;if(present&&!severity)throw Error('Falta severidad en '+labels[category]+'.');result[category]={presente:present,severidad:present?severity:null,evidencia_dudosa:$('d_'+category).checked}}return result}
function show(){let p=current(),review=reviews[p.id];$('photo').src='/photo?id='+encodeURIComponent(p.id);$('meta').innerHTML=`<b>${esc(p.id)}</b><br>Grupo: ${esc(p.cluster)} · Criterio: ${esc(p.selection_role||'—')}<br><small>${esc(p.path)}</small>`;$('rows').innerHTML=categories.map(c=>{let v=review?.categories?.[c]||{};return `<tr class="${review?'reviewed':''}"><th>${labels[c]}</th><td><input id="p_${c}" data-category="${c}" type="checkbox" ${v.presente===true?'checked':''}></td><td><select id="s_${c}" ${v.presente===true?'':'disabled'}><option value="">Elegir</option>${['leve','medio','severo'].map(x=>`<option ${v.severidad===x?'selected':''}>${x}</option>`).join('')}</select></td><td><input id="d_${c}" type="checkbox" ${v.evidencia_dudosa?'checked':''}></td></tr>`}).join('');$('notes').value=review?.notes||'';$('progress').textContent=`${index+1}/${photos.length} · ${Object.keys(reviews).length} guardadas`;document.querySelectorAll('select,input,textarea').forEach(e=>{let changed=()=>{dirty=true;if(e.id.startsWith('p_')){let c=e.dataset.category,s=$('s_'+c);s.disabled=!e.checked;if(s.disabled)s.value=''}};e.onchange=changed;e.oninput=changed});dirty=false;message(review?'Revisión guardada.':'Sin revisar.')}
async function save(){try{let p=current(),payload={id:p.id,categories:values(),notes:$('notes').value};let response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(payload)});if(!response.ok)throw Error(await response.text());reviews[p.id]={...payload,reviewed:true};dirty=false;if(index<photos.length-1){index++;show()}else{show();message('Piloto completo: todas las revisiones quedaron guardadas.')}}catch(error){message(error.message,true)}}
function go(next){if(dirty&&!confirm('Hay cambios sin guardar. ¿Continuar?'))return;index=Math.max(0,Math.min(photos.length-1,next));show()}$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('save').onclick=save;window.onbeforeunload=event=>{if(dirty){event.preventDefault();event.returnValue=''}};fetch('/api/start').then(r=>r.json()).then(data=>{photos=data.photos;reviews=data.reviews;categories=data.categories;token=data.token;show()}).catch(error=>message(error.message,true));
</script>
</body>
</html>
