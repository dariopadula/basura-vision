<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Basura Visión · anotador</title><style>
:root{font:16px system-ui;color:#172334}body{margin:18px}button{font:inherit;padding:7px 10px;margin:3px}.toolbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center}#canvas{position:relative;display:inline-block;line-height:0;max-width:100%;touch-action:none}#photo{display:block;max-width:100%;max-height:68vh;user-select:none}.box{position:absolute;box-sizing:border-box;border:3px solid;pointer-events:none}.contenedor{border-color:#1682df;background:#1682df22}.residuos{border-color:#ed7200;background:#ed720022}.draft{border-color:#bd00a5}.saved{color:#14733e}.warn{color:#a02b20}li button{padding:2px 8px}
</style></head><body><h1>Anotar contenedores y residuos</h1><p>La foto se muestra con la orientación EXIF aplicada. Las coordenadas se guardan normalizadas sobre esta imagen, igual que el preparador YOLO.</p><div class="toolbar"><button id="prev">← Anterior</button><button id="next">Siguiente →</button><button id="save">Guardar cajas</button><button id="negative">Revisada sin objetos</button><span id="info"></span></div><p id="message"></p><div id="choose" hidden>Clase: <button id="container">Contenedor</button><button id="waste">Residuos</button><button id="cancel">Cancelar</button></div><div id="canvas"><img id="photo" draggable="false"><div id="layers"></div></div><ol id="list"></ol><script>
const $=x=>document.getElementById(x);let photos=[],annotations={},token='',index=0,boxes=[],draft=null,start=null,dirty=false;
function current(){return photos[index]}function message(text,bad=false){$('message').textContent=text;$('message').className=bad?'warn':'saved'}function show(){let p=current();if(!p)return;let saved=annotations[p.id];boxes=structuredClone(saved?.boxes||[]);draft=null;dirty=false;$('photo').src='/photo?id='+encodeURIComponent(p.id);$('info').textContent=`${index+1}/${photos.length} · ${p.id} · ${saved?(saved.negative_confirmed?'negativo confirmado':'guardada'):'sin revisar'}`;message('');draw()}
function draw(){$('layers').replaceChildren();$('list').replaceChildren();$('choose').hidden=!draft;[...boxes,...(draft?[{box:draft,class:'draft'}]:[])].forEach((x,n)=>{let e=document.createElement('div');e.className='box '+x.class;Object.assign(e.style,{left:x.box[0]*100+'%',top:x.box[1]*100+'%',width:(x.box[2]-x.box[0])*100+'%',height:(x.box[3]-x.box[1])*100+'%'});$('layers').append(e);if(n<boxes.length){let li=document.createElement('li');li.textContent=x.class+' ';let b=document.createElement('button');b.textContent='Quitar';b.onclick=()=>{boxes.splice(n,1);dirty=true;draw()};li.append(b);$('list').append(li)}})}
function point(e){let r=$('photo').getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}$('canvas').onpointerdown=e=>{if(draft||!$('photo').complete)return;start=point(e);$('canvas').setPointerCapture(e.pointerId)};$('canvas').onpointermove=e=>{if(!start)return;let p=point(e);draft=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];draw()};$('canvas').onpointerup=()=>{start=null;if(draft&&(draft[2]-draft[0]<.005||draft[3]-draft[1]<.005))draft=null;draw()};
for(let pair of [['container','contenedor'],['waste','residuos']])$(pair[0]).onclick=()=>{boxes.push({class:pair[1],box:draft});draft=null;dirty=true;draw()};$('cancel').onclick=()=>{draft=null;draw()};async function save(negative){if(draft)return message('Clasificá o cancelá la caja pendiente.',true);if(!negative&&!boxes.length)return message('Usá “Revisada sin objetos” para confirmar un negativo.',true);if(negative&&boxes.length&&!confirm('¿Quitar las cajas y confirmar que no hay objetos?'))return;let p=current(),payload={id:p.id,boxes:negative?[]:boxes};let r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(payload)});if(!r.ok)return message(await r.text(),true);annotations[p.id]={...p,reviewed:true,negative_confirmed:negative,boxes:structuredClone(payload.boxes)};show();message('Anotación guardada.')}$('save').onclick=()=>save(false);$('negative').onclick=()=>save(true);function go(n){if((dirty||draft)&&!confirm('Hay cambios sin guardar. ¿Continuar?'))return;index=Math.max(0,Math.min(photos.length-1,n));show()}$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);window.onbeforeunload=e=>{if(dirty||draft){e.preventDefault();e.returnValue=''}};fetch('/api/start').then(r=>r.json()).then(x=>{photos=x.photos;annotations=x.annotations;token=x.token;show()}).catch(e=>message(e.message,true));
</script></body></html>
